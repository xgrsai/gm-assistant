# Optional containerised dev setup. On Windows the native setup (README) is faster:
# bind mounts from NTFS are slow and need polling for reload.
services:
  api:
    build:
      context: ./src/backend
    env_file: .env
    environment:
      DATA_DIR: /data
      ARTIFACTS_DIR: /app/artifacts
      CHECKPOINT_PATH: /app/var/checkpoints.db
      APP_DB_PATH: /app/var/app.db
      WATCHFILES_FORCE_POLLING: "true"
      QDRANT_URL: http://qdrant:6333
      # Ollama runs natively on the host (Windows app); containers reach it through the host gateway.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./src/backend/server:/app/server
      - ./src/backend/keeper:/app/keeper
      - ./src/backend/config:/app/config:ro
      - ./src/backend/experiments:/app/experiments:ro
      - ./data:/data:ro
      - ./artifacts:/app/artifacts
      - api_var:/app/var  # named volume: SQLite WAL is unreliable on bind mounts
    ports:
      # localhost only: the API is unauthenticated and spends the Gemini key
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      retries: 5
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"  # REST API + dashboard at http://localhost:6333/dashboard

  web:
    build:
      context: ./src/frontend
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "1"
    volumes:
      - ./src/frontend:/app
      - web_node_modules:/app/node_modules  # after dependency changes: docker compose up --build -V web
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  qdrant_data: {}
  api_var: {}
  web_node_modules: {}
