services:
  frontend:
    build:
      context: ./src/frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./src/backend
    ports:
      # localhost only: the API is unauthenticated and spends the Gemini key
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src/backend/app:/app
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DEBUG=true