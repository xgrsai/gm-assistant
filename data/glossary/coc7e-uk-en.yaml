# Ukrainian -> English glossary of Call of Cthulhu 7e game terms, for query term normalization before retrieval.
# Built once from the knowledge base's own terminology (section headings, skill and characteristic names of
# data/open/coc7e and the demo investigator sheet), with common Ukrainian renderings of each term.
# It was written before the uk_glossary retrieval run and is not tuned on its results.
#
# Each entry: en = the term as it appears in the knowledge base; uk = regular expressions over Ukrainian text
# (case-insensitive; each pattern is anchored at a word start; \w* absorbs inflection; ['’ʼ] = apostrophe variants).
# A query is annotated by appending the English terms of all matched entries, e.g.
#   "Що дає екстремальний успіх під час атаки?" -> "Що дає екстремальний успіх під час атаки? (Extreme success, attack)"

