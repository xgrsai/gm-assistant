# Phase 3, first thesis comparison: prompt-only vs RAG with the same generator (Gemini).
# Both arms share the aux model, prompts and seeds; RAG arms receive frozen turn contexts (critique C7),
# so the only difference between arms is the retrieved knowledge in the prompts.
#
# Planned calls: uv run python -m evals.run evals/experiments/phase3-gemini.yaml --dry-run
name: phase3-gemini
description: prompt-only vs RAG on gemini-3.8-flash, Ukrainian questions, one seed
scenario_id: demo-haunt
dataset_dir: eval/coc7e
corpus_dirs: [open/coc7e]
seeds: [11]
judge: gemini-judge

fixed:
  aux: gemini-aux
  adjudicator: aux
  prompt_version: keeper-v2
  adjudicate_prompt_version: adjudicate-v2
  analyze_prompt_version: analyze-v1
  history_max_tokens: 6000
  retrieval:
    collection: coc7e__nomic15__c1000o200
    embedder: nomic15
    quotas: {rules: 4, lore: 1}
    exact: true
    min_score: 0.55

arms:
  - arm: prompt
    generator: gemini-flash
    use_rag: false
  - arm: rag
    generator: gemini-flash
    use_rag: true

tasks:
  retrieval:
    k: 10
    query_modes: [en, uk, uk_analyze]
  rules_qa:
    languages: [uk]
  conflict_probes:
    languages: [uk]
    conditions: [perturbed, original, no_context]
  adjudication: {}
