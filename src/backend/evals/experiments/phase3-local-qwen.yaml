# Phase 3, local small model: prompt-only vs RAG with qwen2.5:3b (Ollama) as the generator.
# Narration runs locally (no API quota). RAG contexts are frozen from the English gold wording of each question
# (context_query: question_en), so the whole generation run needs no API call; this is an oracle translation
# and must be reported as such (phase3-gemini uses the production analyze node instead).
# The judge is Gemini and can run later without regenerating answers:
#   uv run python -m evals.run evals/experiments/phase3-local-qwen.yaml --no-judge   # generate now
#   uv run python -m evals.run evals/experiments/phase3-local-qwen.yaml --judge-only # grade when quota allows
name: phase3-local-qwen
description: prompt-only vs RAG on qwen2.5:3b (Ollama), Ukrainian questions, one seed
scenario_id: demo-haunt
dataset_dir: eval/coc7e
corpus_dirs: [open/coc7e]
seeds: [11]
judge: gemini-judge

fixed:
  aux: gemini-aux
  adjudicator: aux
  prompt_version: keeper-v2
  adjudicate_prompt_version: adjudicate-v2
  analyze_prompt_version: analyze-v1
  history_max_tokens: 6000
  retrieval:
    collection: coc7e__nomic15__c1000o200
    embedder: nomic15
    quotas: {rules: 4, lore: 1}
    exact: true
    min_score: 0.55

arms:
  - arm: qwen-prompt
    generator: qwen25-3b-ollama
    use_rag: false
  - arm: qwen-rag
    generator: qwen25-3b-ollama
    use_rag: true

tasks:
  retrieval:
    enabled: false        # generator-independent; see phase3-gemini
  rules_qa:
    languages: [uk]
    context_query: question_en
  conflict_probes:
    languages: [uk]
    conditions: [perturbed, original, no_context]
  adjudication:
    enabled: false        # adjudication uses the aux model, identical to phase3-gemini
