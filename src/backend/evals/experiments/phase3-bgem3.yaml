# Retrieval ablation: phase3-gemini with the multilingual BGE-M3 embedder instead of English nomic-embed-text.
# Only the retrieval task is meant to be run (en, uk: embeddings only, no LLM calls):
#   uv run python -m keeper.rag.ingest ../../data/open/coc7e --embedder bgem3
#   uv run python -m evals.run evals/experiments/phase3-bgem3.yaml --tasks retrieval --query-modes en,uk
name: phase3-bgem3
description: retrieval with the multilingual BGE-M3 embedder (same corpus, chunking and gold set)
scenario_id: demo-haunt
dataset_dir: eval/coc7e
corpus_dirs: [open/coc7e]
seeds: [11]
judge: gemini-judge

fixed:
  aux: gemini-aux
  adjudicator: aux
  prompt_version: keeper-v2
  adjudicate_prompt_version: adjudicate-v2
  analyze_prompt_version: analyze-v1
  history_max_tokens: 6000
  retrieval:
    collection: coc7e__bgem3__c1000o200
    embedder: bgem3
    quotas: {rules: 4, lore: 1}
    exact: true
    min_score: 0.55

arms:
  - arm: prompt
    generator: gemini-flash
    use_rag: false
  - arm: rag
    generator: gemini-flash
    use_rag: true

tasks:
  retrieval:
    k: 10
    query_modes: [en, uk]
  rules_qa:
    languages: [uk]
  conflict_probes:
    languages: [uk]
    conditions: [perturbed, original, no_context]
  adjudication: {}
